limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=uploads:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=shares:10m rate=60r/m;

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 8m;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    limit_req_status 429;

    location ~ ^/api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location ~ ^/api/videos {
        limit_req zone=uploads burst=20 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location /api/ {
        limit_req zone=shares burst=20 nodelay;
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
